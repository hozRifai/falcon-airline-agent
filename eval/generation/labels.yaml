  reply: |-
    When cancellation is due to a medical emergency, Falcon Airline's policy allows for exceptions under certain conditions. Here’s what applies:

    1. **Documentation Required**: If the cancellation is due to a medical emergency, you will need to provide supporting evidence, such as a doctor’s note or medical certificate. This document must be attached to your request.

    2. **Exception Case**: You can request an exception by logging a case with the customer-care team. They will review your evidence and decide whether to approve the cancellation with waived fees or a refund.

    3. **Refund Options**: If approved, you may receive a refund either as travel credit or cash, depending on your preference and the fare rules.

