# Labelled customer messages for the input guardrail (decision #29): what the classifier must let through, flag or block.
#
# label: task | small_talk | out_of_scope | prompt_injection | social_engineering | abuse  (see runtime/guardrails.py)
# disclosures: kinds of travel-affecting facts the guard must notice (decision #34): pregnancy, infant, child_alone, medical, assistance,
#        animal, dangerous_item, travel_documents, other; absent = nothing to notice. figure: the number as stated ("38 months"), which
#        the pattern layer must parse for the eligibility tool.
# pii:   kinds of personal data the redaction layer must remove (card, iban, emirates_id, email, phone); absent = nothing to remove
#
# Written by Claude on 18 Oct 2026 from the attack and off-topic messages seen on the laptop ("write me a python code that says
# hello world"), the adversarial evaluation tasks, and the usual customer requests; EN and AR. The benign set is deliberately
# full of rude, urgent and wrong requests: those must reach the agent, which is what a false block would cost.

