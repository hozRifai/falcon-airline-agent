# Retrieval gold set over the Conditions of Carriage (Emirates text, used with credit; "Emirates" = Falcon).
#
# 20 topics, each asked once in English and once in Arabic (same labels, so the language gap is measured directly).
# Questions are written the way a customer would ask, not in the document's words, so they test retrieval rather than
# string matching. Labels: 2 = the clause that answers the question, 1 = also relevant (used by nDCG; recall and hit
# rate count both). Clause ids are base ids (parts like 7.7.3#2 belong to 7.7.3).
# `answerable: false` items are not in the document; they are excluded from retrieval metrics and used by the
# generation evaluation ("say the document does not cover it").
#
# status: drafted 17 Oct 2026 from a full read of Articles 3-18; reviewed the same day in a second session (every grade-2
# clause id checked against its English text and present in both languages of the index). Hozayfa to skim once.

