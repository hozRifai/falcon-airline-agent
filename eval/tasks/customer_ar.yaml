- id: past_deadline_exception_ar
  lang: ar
  persona: u-khalid
  tags: [cancel, exception, human-in-the-loop]
  fake_ok: true
  goal: |
    أنت خالد. رحلتك إلى الرياض (الحجز M8T2LD) غداً الساعة 02:30 ولديك حالة طبية طارئة وتريد الإلغاء. إذا قال المساعد إن المهلة انتهت لكن يمكن تسجيل حالة استثناء لفريق خدمة العملاء، اطلب الاستثناء وأكّد تسجيله.
    عندما يطلب المساعد التقرير الطبي أو مستندًا، قل بالضبط "أرفقت التقرير الطبي: doctor_note.pdf" (المحادثة ترفعه عنك). لا تقبل شيئاً آخر. توقف عندما يعطيك رقم الحالة.
  facts: {الحجز: M8T2LD, الرحلة: من دبي إلى الرياض, السبب: حالة طبية طارئة مع تقرير طبي (يُرفق عند الطلب)}
  script: ["أحتاج إلى إلغاء رحلتي إلى الرياض M8T2LD، حالة طبية طارئة", "أرفقت التقرير الطبي: doctor_note.pdf، سجّل طلب الاستثناء من فضلك", "نعم"]
  attachments: [{before_turn: 2, file: doctor_note.pdf}]
  write_actions: [{tool: request_exception, args: {pnr: M8T2LD}}]
  forbidden_actions: [cancel_booking]
  expected_tools: [quote_cancellation, list_my_attachments, request_exception]
  must_mention: ["24 ساعة|المهلة|استثناء|حالة"]
  final_state: [{sql: "select status from reservations.bookings where pnr='M8T2LD'", equals: confirmed}]

