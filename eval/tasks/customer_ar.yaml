# ---- the disruption arc and compound requests (τ-bench style: a goal with a fallback, more than one write, a correct "no")
- id: airline_cancelled_rebook_ar
  lang: ar
  persona: u-mariam
  tags: [disruption, change, live-demo]
  goal: |
    أنتِ مريم. وصلتك رسالة بأن رحلتك إلى القاهرة غداً الساعة 13:15 (الحجز M2A7HS) أُلغيت. يجب أن تكوني في القاهرة غداً. اطلبي من المساعد نقلك إلى رحلة أخرى غداً؛ تفضّلين رحلة المساء 19:40 (FA929) إذا عُرضت عليك، وإلا فأي رحلة غداً. اسألي إن كان هناك رسوم. أكّدي عندما يُطلب منك. إذا قال المساعد إنه لا توجد رحلات غداً، اطلبي استرداد كامل المبلغ إلى بطاقتك. توقفي عندما يتأكد التغيير أو الاسترداد.
  facts: {الحجز: M2A7HS, الرحلة الملغاة: FA923 بتاريخ 2026-10-21 الساعة 13:15, الرحلة المفضلة: FA929 بتاريخ 2026-10-21 الساعة 19:40, الدرجة: الخاصة}
  write_actions: [{tool: change_booking, args: {pnr: M2A7HS}}]
  forbidden_actions: [request_exception]
  expected_tools: [get_booking|list_my_bookings|get_flight_status, search_flights, quote_change, change_booking]
  must_mention: ["FA929", "مجان|دون رسوم|بدون رسوم|دون (?:أي )?تكلفة|بدون (?:أي )?تكلفة|لا توجد (?:أي )?تكلفة|0 درهم|0.00"]
  final_state: [{sql: "select flight_instance_id from reservations.booking_segments where pnr='M2A7HS' and seq=1", equals: FA929-2026-10-21}]

- id: change_plus_bag_with_cap_ar
  lang: ar
  persona: u-salma
  tags: [change, baggage, compound]
  goal: |
    أنتِ سلمى. تريدين تأجيل رحلتك إلى البحرين من 26 أكتوبر (الحجز S3L5KQ) إلى رحلة المساء يوم 27 أكتوبر (FA833 الساعة 20:10)، وإضافة حقيبة 20 كجم. شرطك: إذا كانت تكلفة التغيير (الرسوم مع فرق السعر) أكثر من 250 درهماً، لا تغيّري الرحلة وأضيفي الحقيبة فقط. أكّدي كل خطوة عندما يُطلب منك. توقفي عندما تتم الخطوتان (أو الحقيبة فقط إذا كان التغيير أغلى من 250).
  facts: {الحجز: S3L5KQ, الرحلة الحالية: FA831 بتاريخ 2026-10-26 الساعة 08:10, الرحلة المطلوبة: FA833 بتاريخ 2026-10-27 الساعة 20:10, الحقيبة: 20 كجم, الحد: 250 درهم للتغيير}
  write_actions: [{tool: change_booking, args: {pnr: S3L5KQ}}, {tool: add_extra_bag, args: {pnr: S3L5KQ}}]
  forbidden_actions: [cancel_booking, request_exception]
  expected_tools: [quote_change, change_booking, quote_extra_bag, add_extra_bag]
  must_mention: ["200", "90"]
  final_state: [{sql: "select flight_instance_id from reservations.booking_segments where pnr='S3L5KQ' and seq=1", equals: FA833-2026-10-27}, {sql: "select count(*) from reservations.booking_extras where pnr='S3L5KQ' and kg=20", equals: 1}]

- id: delay_refund_refused_then_exception_ar
  lang: ar
  persona: u-reem
  tags: [delay, exception, human-in-the-loop]
  goal: |
    أنتِ ريم. رحلتك إلى مسقط اليوم الساعة 12:00 (الحجز R8E2GN) متأخرة ثلاث ساعات وتريدين إلغاءها واسترداد المبلغ إلى بطاقتك لأنك ستسافرين بالسيارة. إذا قال المساعد إن الاسترداد غير ممكن الآن (التأخير أقل من خمس ساعات والمهلة انتهت) لكن يمكن تسجيل حالة استثناء لفريق خدمة العملاء، اطلبي تسجيلها وأكّدي. توقفي عندما تحصلين على رقم الحالة.
  facts: {الحجز: R8E2GN, الرحلة: FA861 بتاريخ 2026-10-20 الساعة 12:00 من دبي إلى مسقط, التأخير: 180 دقيقة, الدرجة: المرنة}
  write_actions: [{tool: request_exception, args: {pnr: R8E2GN}}]
  forbidden_actions: [cancel_booking, change_booking]
  expected_tools: [quote_cancellation, request_exception]
  must_mention: ["استثنا|حالة|حالت", "خمس|5"]  # حالتك / الاستثنائية: the suffix changes the ending
  final_state: [{sql: "select status from reservations.bookings where pnr='R8E2GN'", equals: confirmed}, {sql: "select count(*) from reservations.approval_requests where pnr='R8E2GN' and status='pending'", equals: 1}]

- id: cheapest_next_week_ar
  lang: ar
  persona: u-layla
  tags: [search, dates]
  fake_ok: true
  goal: |
    أنتِ ليلى. تريدين حجز أرخص رحلة من دبي إلى بيروت الأسبوع القادم لمسافر واحد. قولي "الأسبوع القادم" فقط ولا تذكري أي تاريخ.
    إذا سأل المساعد عن اليوم، قولي "أي يوم في الأسبوع القادم، الأرخص". لا تحجزي شيئًا. توقفي عندما تحصلين على أرخص خيار مع تاريخه وسعره.
  facts: {origin: دبي, destination: بيروت, when: الأسبوع القادم كاملًا (الاثنين 26 أكتوبر إلى الأحد 1 نوفمبر 2026), cheapest}
  script: ["أريد حجز رحلة الأسبوع القادم، ابحث لي عن أرخص رحلة من دبي إلى بيروت"]
  forbidden_actions: [cancel_booking, change_booking, request_exception]
  expected_tools: [search_flights]
  must_mention: ["FA951", "\\b900\\b", "26 أكتوبر|26 تشرين|2026-10-26|الاثنين|الإثنين"]
  # 965 (the 27th) may appear among the alternatives after the cheapest; it must not be presented as the cheapest
  must_not_mention: ['(?:الأرخص|أرخص|الأقل سعر)[^.\n]{0,80}965']

