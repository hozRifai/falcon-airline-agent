  lang: ar
  persona: u-fatima
  tags: [cancel, happy-path]
  fake_ok: true
  goal: |
    أنتِ فاطمة. تريدين إلغاء رحلتك إلى القاهرة (الحجز K3P7QZ) واسترداد المبلغ كرصيد سفر. تقبلين رسوماً حتى 100 درهم للراكب. أكّدي عندما يُطلب منك. توقفي بعد تأكيد الإلغاء.
