# ---- disclosed facts (decision #34, FAILURE_DIARY #48): Hozayfa's finding of 18 Oct as typed (answered then with "have a safe trip"), and a newborn
- id: pregnant_38th_month_ar
  lang: ar
  persona: u-layla
  tags: [disclosure, conditions, live-demo]
  fake_ok: true
  grounding: true
  goal: |
    أنتِ ليلى. أنتِ حامل في الأسبوع الثامن والثلاثين (حمل بجنين واحد)، لكنك تكتبين "شهري" خطأً في رسالتك الأولى. رسالتك الأولى بالضبط:
    "جميل. أنا حامل في شهري الثامن والثلاثين, سأسافر في الوقت المحدد ان شاء الله" (إخبار لا سؤال). إذا سأل المساعد عن الأسبوع، قولي إنك في الأسبوع الثامن والثلاثين
    بجنين واحد. لا تلغي ولا تغيّري شيئًا. توقفي عندما يخبرك المساعد بما تنص عليه شروط النقل في حالتك مع رقم البند.
  facts: {الحجز: إلى الدوحة بالدرجة المرنة, الحمل: الأسبوع 38, بجنين واحد}
  script: ["جميل. أنا حامل في شهري الثامن والثلاثين, سأسافر في الوقت المحدد ان شاء الله"]
  forbidden_actions: [cancel_booking, change_booking, request_exception, create_booking]
  expected_tools: [check_travel_eligibility|search_policy]
  # the reply must give the limit (36 weeks, clause 7.4.3) and must not wish her a good trip: that is exactly what the 18 Oct reply did
  must_mention: ["7\\.4\\.3", "\\b36\\b|السادس والثلاثين"]
  must_not_mention: ["رحلة (?:سعيدة|موفقة|ممتعة|مريحة|آمنة|طيبة|هنيئة)|نتمنى لك[^.\\n]{0,30}رحلة|سفر(?:ًا|ا)? (?:سعيد|موفق|آمن)|bon voyage|safe (?:trip|flight|travels)|(?:good|great|nice|pleasant|comfortable) (?:trip|flight)"]

