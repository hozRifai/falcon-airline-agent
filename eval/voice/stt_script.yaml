# Sentences read aloud on one call per language to compare speech-to-text services on the same voice (decision #55).
# Read them in order, at a normal pace, with a short pause after each; the agent will answer some of them, which is fine.
# scripts/voice_stt_compare.py scores every service's transcripts from that call against this list.
ar:
  - السلام عليكم، أريد أن ألغي حجزي K3P7QZ.
  - رحلتي FA929 من دبي إلى القاهرة يوم الأربعاء.
  - كم المبلغ المسترد إذا ألغيت الآن؟
  - أفضّل الاسترداد كرصيد سفر.
  - نعم، أؤكد الإلغاء.
  - أنا حامل في الأسبوع السابع والثلاثين، هل أستطيع السفر؟
  - بدي غيّر الرحلة لبكرا الصبح إذا في مكان.
  - شو الرسوم إذا غيّرت الموعد؟
  - عندي حقيبة إضافية وزنها ثلاثة وعشرون كيلو.
  - المبلغ ألف ومئتان وواحد وتسعون درهم، صح؟
en:
  - Hi, I'd like to cancel my booking K3P7QZ.
  - My flight is FA929 from Dubai to Cairo on Wednesday.
  - How much would I get back if I cancel now?
  - Travel credit is fine.
  - Yes, please go ahead.
  - I'm thirty seven weeks pregnant, can I still fly?
  - Can you move me to the earliest flight tomorrow morning?
  - I have one extra bag, about twenty three kilos.
  - The refund is one thousand two hundred ninety one dirhams, right?
