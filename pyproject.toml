[project]
name = "falcon"
version = "0.1.0"
description = "Falcon Airline customer-service agent: LangGraph runtime, three MCP servers, deterministic rules, bilingual policy search, evaluation harness."
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0",                       # 2.x renamed FastMCP and breaks langchain-mcp-adapters; stay on 1.x
  "langgraph==1.2.15",
  "langchain==1.4.6",
  "langchain-openai==1.7.2",           # OpenRouter is OpenAI-compatible: one client for any model
  "langchain-mcp-adapters==0.3.2",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "pymupdf==1.28.2",
  "PyJWT[crypto]",
  "httpx",
  "pyyaml",
  "openai",
  "sse-starlette",
  # Tracing (decision #27): OpenTelemetry once, any backend (Phoenix locally, Langfuse, any OTLP collector)
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-asgi",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-psycopg",
  "openinference-instrumentation-langchain==0.1.79",
  "tzdata",                            # IANA zones for ZoneInfo on Windows and slim images (airports.tz)
  "num2words",                         # the voice channel's speech normaliser (amounts as words, EN and AR)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
# The voice channel (docs/VOICE_PLAN.md) runs on the laptop, outside Docker: see scripts/voice.sh
voice = ["pipecat-ai[webrtc,deepgram,elevenlabs,runner]==1.13.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors and likely bugs (pyflakes, syntax, bugbear, blind excepts, invalid characters), modern syntax, simplifications,
# and no stale `noqa` markers. Long lines are allowed: the code favours one statement per line over wrapping.
select = ["F", "E4", "E7", "E9", "B", "BLE", "UP", "SIM", "PLE", "RUF100"]
ignore = ["E501", "B008", "SIM105", "SIM108", "SIM117"]
